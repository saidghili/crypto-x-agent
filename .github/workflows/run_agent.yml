name: Run Crypto X Agent

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install textblob requests
          python -m textblob.download_corpora || true

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Crypto X Agent
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SEND_EMAIL_REPORT: "true"
          OUTPUT_DIR: reports
        run: |
          echo "Starting Crypto X Agent V9..."
          python crypto_x_agent_v9_improved.py || echo "Script completed with status: $?"
          echo "Listing reports directory:"
          ls -la reports/ || echo "No reports directory"

      - name: Send Email with Report
        if: always()
        uses: dawidd6/action-send-mail@v3.13.0
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.EMAIL_FROM }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Crypto X Agent Report - Daily Analysis"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Rapport d'analyse Crypto X Agent généré automatiquement.
            
            Vérifiez les artifacts sur GitHub Actions pour les rapports complets.
            
            Lien: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload reports
        uses: actions/upload-artifact@v4.3.1
        if: always()
        with:
          name: crypto-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
