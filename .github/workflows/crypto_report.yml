name: Crypto X Agent V8.2 - Daily Report

on:
  schedule:
    - cron: "10 10 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  crypto-x-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crypto X Agent V9.1
        env:
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OUTPUT_DIR: ./reports
          MAX_TWEETS_PER_ACCOUNT: 20
          USE_GPT_SYNTHESIS: ${{ vars.USE_GPT_SYNTHESIS || 'true' }}
          GPT_MODEL: ${{ vars.GPT_MODEL || 'gpt-4-turbo' }}
          SEND_EMAIL_REPORT: ${{ vars.SEND_EMAIL_REPORT || 'true' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python main.py

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-x-reports-v91-${{ github.run_number }}
          path: reports/
          retention-days: 30
          compression-level: 9
          if-no-files-found: warn

      - name: List generated files
        if: always()
        run: |
          echo "Generated files:"
          ls -lh reports/ 2>/dev/null || echo "No reports directory"
